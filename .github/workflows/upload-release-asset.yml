# v2 re-register
name: Upload qqwry.ipdb to release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload asset to'
        required: true

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Download qqwry.ipdb from main
        run: |
          curl -sL --retry 3 -o qqwry.ipdb "https://raw.githubusercontent.com/${{ github.repository }}/main/qqwry.ipdb"
          ls -la qqwry.ipdb
      - name: Upload asset
        env:
          GH_TOKEN: *** github_token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" qqwry.ipdb --clobber
